name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Añade aquí tus pasos para setup y build
      - name: Build
        run: echo "Running build..."
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
