name: 05 - PR Validation

on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Run unit tests
        run: npm test --if-present
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  security-pr-scan:
    name: PR Security Scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Detect secrets in changed files
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          LINES_CHANGED=$(git diff --shortstat "$BASE" "$HEAD" | awk '{print $4+$6}')
          echo "Lines changed: ${LINES_CHANGED}"
          if [ "${LINES_CHANGED}" -gt 1000 ]; then
            echo "::warning::This PR changes ${LINES_CHANGED} lines. Consider splitting it into smaller PRs."
          fi

  pr-comment:
    name: Post PR Summary
    runs-on: ubuntu-latest
    needs: [pr-checks, security-pr-scan]
    if: always() && github.event.pull_request.draft == false
    steps:
      - name: Post status comment
        uses: actions/github-script@v7
        with:
          script: |
            const checks = '${{ needs.pr-checks.result }}';
            const security = '${{ needs.security-pr-scan.result }}';
            const allPassed = checks === 'success' && security === 'success';
            const body = allPassed
              ? '✅ **All PR checks passed!** This PR is ready for review.'
              : `⚠️ **Some checks need attention:**\n- Quality checks: ${checks}\n- Security scan: ${security}\n\nPlease review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
        continue-on-error: true
