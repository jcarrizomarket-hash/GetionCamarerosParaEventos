name: Auto Remediation

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      run_audit:
        description: 'Run dependency audit'
        required: false
        default: 'true'
        type: boolean
      run_conflict_check:
        description: 'Run merge conflict check'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  detect-vulnerabilities:
    name: Detect Dependency Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_vulnerabilities: ${{ steps.audit.outputs.has_vulnerabilities }}
      vulnerability_count: ${{ steps.audit.outputs.vulnerability_count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit and capture results
        id: audit
        run: |
          set +e
          npm audit --json > audit-results.json 2>&1
          AUDIT_EXIT=$?
          set -e

          VULN_COUNT=$(cat audit-results.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          meta = data.get('metadata', {})
          vulns = meta.get('vulnerabilities', {})
          total = vulns.get('critical', 0) + vulns.get('high', 0) + vulns.get('moderate', 0)
          print(total)
          " 2>/dev/null || echo "0")

          echo "vulnerability_count=$VULN_COUNT" >> $GITHUB_OUTPUT

          if [ "$VULN_COUNT" -gt "0" ]; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
            echo "Found $VULN_COUNT vulnerabilities"
          else
            echo "has_vulnerabilities=false" >> $GITHUB_OUTPUT
            echo "No vulnerabilities found"
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: daily-audit-results
          path: audit-results.json
          retention-days: 90

  attempt-auto-fix:
    name: Attempt Automatic Dependency Fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    needs: detect-vulnerabilities
    if: needs.detect-vulnerabilities.outputs.has_vulnerabilities == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Attempt npm audit fix
        run: |
          npm audit fix 2>&1 | tee audit-fix-output.txt || true

      - name: Check if fix was applied
        id: fix_check
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "fix_applied=false" >> $GITHUB_OUTPUT
            echo "No automatic fixes were applied."
          else
            echo "fix_applied=true" >> $GITHUB_OUTPUT
            echo "Automatic fixes were applied."
          fi

      - name: Run build to verify fix
        if: steps.fix_check.outputs.fix_applied == 'true'
        run: npm run build

      - name: Create pull request with fixes
        if: steps.fix_check.outputs.fix_applied == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix(security): auto-fix npm audit vulnerabilities'
          title: '[Auto-Remediation] Fix npm dependency vulnerabilities'
          body: |
            ## Automated Dependency Fix

            This PR was automatically generated by the Auto Remediation workflow.

            ### What was fixed
            `npm audit fix` was run and updated dependencies to patch known vulnerabilities.

            ### Vulnerability count before fix
            ${{ needs.detect-vulnerabilities.outputs.vulnerability_count }} vulnerabilities detected.

            ### Next steps
            1. Review the changes to `package.json` and `package-lock.json`.
            2. Verify the build passes.
            3. Test the application manually for any regressions.
            4. Merge this PR to apply the security fixes.

            > ⚠️ If `npm audit fix --force` is needed for remaining issues, manual review is required.
          branch: auto-remediation/fix-vulnerabilities
          delete-branch: true
          labels: security,automated,dependencies

  detect-merge-conflicts:
    name: Detect Merge Conflicts in Source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_conflicts: ${{ steps.conflict_check.outputs.has_conflicts }}
      conflict_files: ${{ steps.conflict_check.outputs.conflict_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for merge conflict markers
        id: conflict_check
        run: |
          CONFLICT_FILES=$(grep -rln "^<<<<<<< \|^=======$\|^>>>>>>> " \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" \
            src/ 2>/dev/null || true)

          if [ -n "$CONFLICT_FILES" ]; then
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "conflict_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICT_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "Merge conflicts found in:"
            echo "$CONFLICT_FILES"
          else
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "conflict_files=" >> $GITHUB_OUTPUT
            echo "No merge conflicts detected."
          fi

  create-conflict-issue:
    name: Create Issue for Unresolved Merge Conflicts
    runs-on: ubuntu-latest
    permissions:
      issues: write
    needs: detect-merge-conflicts
    if: needs.detect-merge-conflicts.outputs.has_conflicts == 'true'
    steps:
      - name: Create GitHub issue for merge conflicts
        uses: actions/github-script@v7
        with:
          script: |
            const conflictFiles = `${{ needs.detect-merge-conflicts.outputs.conflict_files }}`;
            const body = `## 🚨 Unresolved Merge Conflicts Detected

            The daily auto-remediation scan found unresolved Git merge conflict markers in the source code.

            ### Affected Files
            \`\`\`
            ${conflictFiles}
            \`\`\`

            ### Impact
            - ❌ These files will fail to compile
            - ❌ The application build will fail
            - ❌ Users will see errors or the app will not load

            ### Required Action
            1. Open each affected file
            2. Locate all \`<<<<<<\`, \`=======\`, and \`>>>>>>>\` markers
            3. Resolve the conflict by choosing the correct version
            4. Remove all conflict markers
            5. Commit and push the resolved files

            ### Detection
            This issue was automatically created by the Auto Remediation workflow.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 [Auto-Detected] Unresolved merge conflicts in source code',
              body: body,
              labels: ['bug', 'critical', 'automated']
            });

  monitor-build-health:
    name: Monitor Build Health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install and build
        id: build
        run: |
          npm ci
          npm run build 2>&1 | tee build-output.txt
          if [ $? -eq 0 ]; then
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "build_status=failure" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Create issue if build is broken
        if: steps.build.outputs.build_status == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🔴 Build Failure Detected

            The daily health check found that the application build is failing on the \`${{ github.ref_name }}\` branch.

            ### Action Required
            1. Review recent commits for breaking changes
            2. Check for missing dependencies or import errors
            3. Fix the build and verify with: \`npm ci && npm run build\`

            ### Workflow Run
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔴 [Auto-Detected] Build failure on ' + context.ref,
              body: body,
              labels: ['bug', 'critical', 'automated', 'build']
            });

  remediation-summary:
    name: Daily Remediation Summary
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - detect-vulnerabilities
      - attempt-auto-fix
      - detect-merge-conflicts
      - monitor-build-health
    if: always()
    steps:
      - name: Print daily summary
        run: |
          echo "=== Daily Auto-Remediation Summary ==="
          echo "Date: $(date -u +%Y-%m-%d)"
          echo ""
          echo "Vulnerability Scan:     ${{ needs.detect-vulnerabilities.result }}"
          echo "  - Has vulnerabilities: ${{ needs.detect-vulnerabilities.outputs.has_vulnerabilities }}"
          echo "  - Count: ${{ needs.detect-vulnerabilities.outputs.vulnerability_count }}"
          echo ""
          echo "Auto Fix Attempt:       ${{ needs.attempt-auto-fix.result }}"
          echo ""
          echo "Merge Conflict Check:   ${{ needs.detect-merge-conflicts.result }}"
          echo "  - Has conflicts: ${{ needs.detect-merge-conflicts.outputs.has_conflicts }}"
          echo ""
          echo "Build Health Check:     ${{ needs.monitor-build-health.result }}"
