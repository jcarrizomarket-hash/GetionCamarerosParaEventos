name: Audit

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  audit:
    name: Security & Code Quality Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run audit script
        run: bash scripts/audit.sh
