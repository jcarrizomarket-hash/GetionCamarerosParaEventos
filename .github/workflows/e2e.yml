name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      VITE_DEMO_MODE: 'true'
      VITE_SUPABASE_URL: 'https://placeholder.supabase.co'
      VITE_SUPABASE_ANON_KEY: 'placeholder-key-for-ci'
      VITE_SUPABASE_FUNCTIONS_URL: 'https://placeholder.supabase.co/functions/v1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-

      - name: Install Playwright browsers
        working-directory: src
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps only (cache hit)
        working-directory: src
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build app
        run: npm run build

      - name: Run E2E tests
        working-directory: src
        env:
          TEST_BASE_URL: 'http://localhost:4173'
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 > /dev/null && echo "Server ready (${i}s)" && break
            sleep 1
          done
          echo "=== HTML served by vite preview ==="
          curl -s http://localhost:4173 | head -30
          echo "=== JS bundle response ==="
          curl -s http://localhost:4173/assets/ | head -5 || true
          npx playwright test --config playwright.config.ts --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: src/playwright-report/
          retention-days: 7
