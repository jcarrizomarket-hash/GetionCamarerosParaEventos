name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  conflict-check:
    name: Merge Conflict Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for merge conflict markers
        run: |
          if grep -rn "^<<<<<<< \|^=======$\|^>>>>>>> " --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" src/ 2>/dev/null; then
            echo "ERROR: Merge conflict markers found in source files"
            exit 1
          fi
          echo "No conflict markers found"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        working-directory: src
        run: npx vitest run --config vitest.config.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: NPM audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true   # warn but don't fail CI initially
      - name: Check for high/critical vulnerabilities
        run: |
          AUDIT_OUTPUT=$(npm audit --json 2>/dev/null || true)
          HIGH=$(echo "$AUDIT_OUTPUT" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); try{ const j=JSON.parse(d); console.log((j.metadata?.vulnerabilities?.high||0)+(j.metadata?.vulnerabilities?.critical||0)); }catch(e){ console.log(0); }")
          echo "High/Critical vulnerabilities: $HIGH"
          if [ "$HIGH" -gt "0" ]; then
            echo "::warning::Found $HIGH high/critical vulnerabilities. Run 'npm audit fix' locally."
          fi
