name: 🧪 Staging Merge

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Group(s) to merge (1, 2, 3, 4, or "all" for groups 1-4)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '1'
          - '2'
          - '3'
          - '4'
      pr_numbers:
        description: 'Override: specific PR numbers (comma-separated). Overrides group selection.'
        required: false
        default: ''
      confirm_merge:
        description: 'Type "CONFIRM" to proceed with merge (safety check)'
        required: true
        default: ''
      dry_run:
        description: 'Dry run (validate only, do not merge)'
        required: false
        default: false
        type: boolean

env:
  TARGET_BRANCH: staging
  GROUP_1: '49,48,50,64'
  GROUP_2: '52,53,55,24'
  GROUP_3: '58,23,27,28'
  GROUP_4: '30,45,46,47'

jobs:
  confirm-intent:
    name: Confirm Merge Intent
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_merge }}" != "CONFIRM" ]; then
            echo "❌ Merge not confirmed. You must type 'CONFIRM' to proceed."
            exit 1
          fi
          echo "✅ Merge confirmed by @${{ github.actor }}"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: confirm-intent
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        # Warn rather than block so teams can triage vulnerabilities before halting staging
        run: npm audit --audit-level=high || echo "::warning::High-severity vulnerabilities found - review required before production"

      - name: Run type check
        run: npm run type-check --if-present

      - name: Run lint
        run: npm run lint --if-present || echo "::warning::Lint issues found"

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: confirm-intent
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-build-${{ github.run_id }}
          path: dist/
          retention-days: 7

  validate-and-merge:
    name: Validate & Merge PRs to staging
    runs-on: ubuntu-latest
    needs: [security-scan, build-check]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine PRs to merge
        id: determine-prs
        run: |
          if [ -n "${{ github.event.inputs.pr_numbers }}" ]; then
            PR_LIST="${{ github.event.inputs.pr_numbers }}"
          elif [ "${{ github.event.inputs.group }}" = "1" ]; then
            PR_LIST="${GROUP_1}"
          elif [ "${{ github.event.inputs.group }}" = "2" ]; then
            PR_LIST="${GROUP_2}"
          elif [ "${{ github.event.inputs.group }}" = "3" ]; then
            PR_LIST="${GROUP_3}"
          elif [ "${{ github.event.inputs.group }}" = "4" ]; then
            PR_LIST="${GROUP_4}"
          else
            PR_LIST="${GROUP_1},${GROUP_2},${GROUP_3},${GROUP_4}"
          fi
          echo "pr_list=${PR_LIST}" >> $GITHUB_OUTPUT
          echo "📋 PRs to process: ${PR_LIST}"

      - name: Pre-merge validation
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra PRS <<< "${{ steps.determine-prs.outputs.pr_list }}"
          VALID_PRS=()
          INVALID_PRS=()

          for PR in "${PRS[@]}"; do
            PR=$(echo $PR | tr -d ' ')
            echo "🔍 Validating PR #${PR}..."

            PR_DATA=$(gh pr view "${PR}" --json state,mergeable,reviewDecision,statusCheckRollup \
              --repo ${{ github.repository }} 2>/dev/null || echo '{"state":"not_found"}')

            STATE=$(echo "$PR_DATA" | jq -r '.state // "unknown"')
            MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable // "UNKNOWN"')
            REVIEW=$(echo "$PR_DATA" | jq -r '.reviewDecision // "NONE"')

            if [ "$STATE" != "OPEN" ]; then
              echo "  ⚠️  PR #${PR} is not open (state: ${STATE}) - skipping"
              INVALID_PRS+=("${PR}:not_open")
              continue
            fi

            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "  ❌ PR #${PR} has conflicts"
              INVALID_PRS+=("${PR}:conflicts")
              continue
            fi

            if [ "$REVIEW" = "CHANGES_REQUESTED" ]; then
              echo "  ❌ PR #${PR} has changes requested"
              INVALID_PRS+=("${PR}:changes_requested")
              continue
            fi

            echo "  ✅ PR #${PR} is valid (review: ${REVIEW})"
            VALID_PRS+=("${PR}")
          done

          VALID_LIST=$(IFS=','; echo "${VALID_PRS[*]}")
          INVALID_LIST=$(IFS=','; echo "${INVALID_PRS[*]}")
          echo "valid_prs=${VALID_LIST}" >> $GITHUB_OUTPUT
          echo "invalid_prs=${INVALID_LIST}" >> $GITHUB_OUTPUT
          echo ""
          echo "✅ Valid PRs: ${VALID_LIST}"
          echo "⚠️  Skipped PRs: ${INVALID_LIST}"

      - name: Merge PRs to staging
        if: steps.validate.outputs.valid_prs != '' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra PRS <<< "${{ steps.validate.outputs.valid_prs }}"
          MERGED=()
          FAILED=()

          for PR in "${PRS[@]}"; do
            PR=$(echo $PR | tr -d ' ')
            [ -z "$PR" ] && continue
            echo "🔀 Merging PR #${PR} into ${TARGET_BRANCH}..."

            if gh pr merge "${PR}" \
              --merge \
              --repo ${{ github.repository }} \
              --admin \
              --subject "chore: merge PR #${PR} to ${TARGET_BRANCH} [staging]" 2>&1; then
              echo "  ✅ PR #${PR} merged successfully"
              MERGED+=("${PR}")
            else
              echo "  ❌ Failed to merge PR #${PR}"
              FAILED+=("${PR}")
            fi

            sleep 5
          done

          MERGED_LIST=$(IFS=','; echo "${MERGED[*]}")
          FAILED_LIST=$(IFS=','; echo "${FAILED[*]}")
          echo ""
          echo "📊 Merged: ${MERGED_LIST}"
          echo "❌ Failed: ${FAILED_LIST}"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::warning::Some PRs failed to merge: ${FAILED_LIST}"
          fi

      - name: Update version for staging
        if: steps.validate.outputs.valid_prs != '' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date +%Y%m%d)
          RUN="${{ github.run_number }}"
          echo "staging-${DATE}.${RUN}" > .staging-version
          git add .staging-version || true
          git diff --staged --quiet || git commit -m "chore: update staging version ${DATE}.${RUN} [skip ci]"
          git push origin HEAD:${TARGET_BRANCH} || true

      - name: Dry run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 DRY RUN - No merges performed"
          echo "Would have merged: ${{ steps.validate.outputs.valid_prs }}"
          echo "Skipped: ${{ steps.validate.outputs.invalid_prs }}"

      - name: Generate workflow summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🧪 Staging Merge Summary

          | Parameter | Value |
          |-----------|-------|
          | Target Branch | `staging` |
          | Group | `${{ github.event.inputs.group }}` |
          | Dry Run | `${{ github.event.inputs.dry_run }}` |
          | Confirmed By | @${{ github.actor }} |
          | Run ID | `${{ github.run_id }}` |

          ### PRs Processed
          - **Valid PRs:** `${{ steps.validate.outputs.valid_prs }}`
          - **Skipped PRs:** `${{ steps.validate.outputs.invalid_prs }}`

          ### Groups Reference
          | Group | PRs | Purpose |
          |-------|-----|---------|
          | Group 1 (CRITICAL) | #49, #48, #50, #64 | Core functionality |
          | Group 2 (INFRASTRUCTURE) | #52, #53, #55, #24 | Infrastructure |
          | Group 3 (QUALITY) | #58, #23, #27, #28 | Quality improvements |
          | Group 4 (ARCHITECTURE) | #30, #45, #46, #47 | Architecture changes |

          ### Pre-merge Checks
          - ✅ Security scan completed
          - ✅ Build verification completed
          - ✅ PR validation completed
          EOF
