name: 🚀 Demo/Development Merge

on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'PR numbers to merge (comma-separated, e.g. 49,48,50). Leave empty to merge all groups 1-3.'
        required: false
        default: ''
      group:
        description: 'Group to merge (1, 2, 3, or "all" for groups 1-3)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - '1'
          - '2'
          - '3'
      dry_run:
        description: 'Dry run (validate only, do not merge)'
        required: false
        default: false
        type: boolean

env:
  TARGET_BRANCH: develop
  # Groups definition
  GROUP_1: '49,48,50,64'
  GROUP_2: '52,53,55,24'
  GROUP_3: '58,23,27,28'

jobs:
  validate-and-merge:
    name: Validate & Merge PRs to develop
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine PRs to merge
        id: determine-prs
        run: |
          if [ -n "${{ github.event.inputs.pr_numbers }}" ]; then
            PR_LIST="${{ github.event.inputs.pr_numbers }}"
          elif [ "${{ github.event.inputs.group }}" = "1" ]; then
            PR_LIST="${GROUP_1}"
          elif [ "${{ github.event.inputs.group }}" = "2" ]; then
            PR_LIST="${GROUP_2}"
          elif [ "${{ github.event.inputs.group }}" = "3" ]; then
            PR_LIST="${GROUP_3}"
          else
            PR_LIST="${GROUP_1},${GROUP_2},${GROUP_3}"
          fi
          echo "pr_list=${PR_LIST}" >> $GITHUB_OUTPUT
          echo "📋 PRs to process: ${PR_LIST}"

      - name: Pre-merge validation
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra PRS <<< "${{ steps.determine-prs.outputs.pr_list }}"
          VALID_PRS=()
          INVALID_PRS=()

          for PR in "${PRS[@]}"; do
            PR=$(echo $PR | tr -d ' ')
            echo "🔍 Validating PR #${PR}..."

            # Check PR exists and is open
            PR_DATA=$(gh pr view "${PR}" --json state,mergeable,reviewDecision,statusCheckRollup \
              --repo ${{ github.repository }} 2>/dev/null || echo '{"state":"not_found"}')

            STATE=$(echo "$PR_DATA" | jq -r '.state // "unknown"')
            MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable // "UNKNOWN"')

            if [ "$STATE" != "OPEN" ]; then
              echo "  ⚠️  PR #${PR} is not open (state: ${STATE}) - skipping"
              INVALID_PRS+=("${PR}:not_open")
              continue
            fi

            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "  ❌ PR #${PR} has conflicts"
              INVALID_PRS+=("${PR}:conflicts")
              continue
            fi

            echo "  ✅ PR #${PR} is valid for merge"
            VALID_PRS+=("${PR}")
          done

          VALID_LIST=$(IFS=','; echo "${VALID_PRS[*]}")
          INVALID_LIST=$(IFS=','; echo "${INVALID_PRS[*]}")
          echo "valid_prs=${VALID_LIST}" >> $GITHUB_OUTPUT
          echo "invalid_prs=${INVALID_LIST}" >> $GITHUB_OUTPUT
          echo ""
          echo "✅ Valid PRs: ${VALID_LIST}"
          echo "⚠️  Skipped PRs: ${INVALID_LIST}"

      - name: Merge PRs to develop
        if: steps.validate.outputs.valid_prs != '' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra PRS <<< "${{ steps.validate.outputs.valid_prs }}"
          MERGED=()
          FAILED=()

          for PR in "${PRS[@]}"; do
            PR=$(echo $PR | tr -d ' ')
            [ -z "$PR" ] && continue
            echo "🔀 Merging PR #${PR} into ${TARGET_BRANCH}..."

            if gh pr merge "${PR}" \
              --merge \
              --repo ${{ github.repository }} \
              --admin \
              --subject "chore: merge PR #${PR} to ${TARGET_BRANCH} [demo]" 2>&1; then
              echo "  ✅ PR #${PR} merged successfully"
              MERGED+=("${PR}")
            else
              echo "  ❌ Failed to merge PR #${PR}"
              FAILED+=("${PR}")
            fi

            # Brief pause between merges to avoid race conditions
            sleep 3
          done

          echo ""
          echo "📊 Results:"
          echo "  Merged: $(IFS=','; echo "${MERGED[*]}")"
          echo "  Failed: $(IFS=','; echo "${FAILED[*]}")"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::warning::Some PRs failed to merge: $(IFS=','; echo "${FAILED[*]}")"
          fi

      - name: Dry run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 DRY RUN - No merges performed"
          echo "Would have merged PRs: ${{ steps.validate.outputs.valid_prs }}"
          echo "Skipped PRs: ${{ steps.validate.outputs.invalid_prs }}"

      - name: Generate workflow summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🚀 Demo/Development Merge Summary

          | Parameter | Value |
          |-----------|-------|
          | Target Branch | `develop` |
          | Group | `${{ github.event.inputs.group }}` |
          | Dry Run | `${{ github.event.inputs.dry_run }}` |
          | Triggered By | @${{ github.actor }} |

          ### PRs Processed
          - **Valid PRs:** `${{ steps.validate.outputs.valid_prs }}`
          - **Skipped PRs:** `${{ steps.validate.outputs.invalid_prs }}`

          ### Groups Reference
          | Group | PRs | Purpose |
          |-------|-----|---------|
          | Group 1 (CRITICAL) | #49, #48, #50, #64 | Core functionality |
          | Group 2 (INFRASTRUCTURE) | #52, #53, #55, #24 | Infrastructure |
          | Group 3 (QUALITY) | #58, #23, #27, #28 | Quality improvements |
          EOF
